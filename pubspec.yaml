name: meu_bujo
description: "Meu Bujo: bullet journal fofo com gatinha."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  home_widget: ^0.10.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícone do app: a gatinha (gerada por tool/gerar_icone_test.dart).
# Para refazer: flutter test tool/gerar_icone_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone.png"
  adaptive_icon_background: "#FFF6EC"
  adaptive_icon_foreground: "assets/icone/icone_frente.png"
  min_sdk_android: 21
